<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f2f2f7" />
<title>井字棋 · 联机对战</title>
<script>
  (function () {
    var t = 'light';
    try {
      t = localStorage.getItem('chess-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  })();
</script>
<link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="wrap wrap--game">
    <nav class="nav">
      <a class="icon-btn" href="./" aria-label="返回入口">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 5.5 8 12l6.5 6.5" />
        </svg>
      </a>
      <span class="spacer"></span>
      <button class="code-chip" id="code-chip" type="button" hidden aria-label="复制邀请链接">
        <span class="room-code" id="show-code">-----</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="10.5" height="10.5" rx="2.6" />
          <path d="M15 6.6A2.6 2.6 0 0 0 12.4 4H6.6A2.6 2.6 0 0 0 4 6.6v5.8A2.6 2.6 0 0 0 6.6 15" />
        </svg>
      </button>
      <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="切换深色外观">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.1" />
          <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5" />
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.4 14.2A8.5 8.5 0 1 1 9.8 3.6a6.7 6.7 0 0 0 10.6 10.6Z" />
        </svg>
      </button>
    </nav>

    <section class="card lobby" id="lobby">
      <header class="lobby-head">
        <h1 class="lobby-title">井字棋</h1>
        <p class="lobby-sub">3 × 3 · 三连成线即胜</p>
      </header>
      <p class="lobby-note">点「创建房间」，把邀请链接发给对方；他打开就自动进同一间房。</p>
      <div class="rounds-row">
        <div class="rounds-head">
          <span class="rounds-label">总局数</span>
          <span class="rounds-note">打满后统计本轮胜负</span>
        </div>
        <div class="seg" id="total-pick" role="group" aria-label="总局数">
          <button type="button" class="seg-btn is-on" data-total="8">8</button>
          <button type="button" class="seg-btn" data-total="16">16</button>
          <button type="button" class="seg-btn" data-total="32">32</button>
          <button type="button" class="seg-btn" data-total="custom">自定义</button>
        </div>
        <div class="rounds-custom" id="total-custom-row" hidden>
          <input class="field" id="total-input" type="number" inputmode="numeric" min="1" max="99"
                 step="1" placeholder="输入总局数，例如 12" aria-label="自定义总局数" />
          <span class="rounds-unit">局</span>
        </div>
      </div>
      <button type="button" class="btn btn--primary btn--wide" id="create-btn">创建房间</button>
      <div class="actions-row">
        <input class="field" id="code-input" type="text" maxlength="5" placeholder="输入房间码"
               autocomplete="off" spellcheck="false" inputmode="latin" aria-label="房间码" />
        <button type="button" class="btn btn--ghost" id="join-btn">加入</button>
      </div>
    </section>

    <section id="game" hidden>
      <div class="stage">
        <div class="stage-main">
          <header class="stage-head">
            <div class="title-row">
              <h2 class="game-title">井字棋</h2>
              <span class="badge" id="mode-label">联机</span>
              <span class="turn-conn" id="conn-text">离线</span>
            </div>

          <dl class="scoreboard" id="scoreboard" aria-label="比分与局数">
            <div class="score is-me"><dt>你</dt><dd id="score-me">0</dd></div>
            <div class="score"><dt>平局</dt><dd id="score-draw">0</dd></div>
            <div class="score is-opp"><dt>对方</dt><dd id="score-opp">0</dd></div>
            <div class="score is-round">
              <dt>局数</dt>
              <dd><span id="round-done">0</span><i class="rb-slash" id="round-slash">/</i><span id="round-now">1</span></dd>
            </div>
          </dl>

            <div class="stage-status">
              <div class="turn-row">
                <span class="dot" id="dot"></span>
                <span class="turn-text" id="status" role="status" aria-live="polite" data-tone="idle">等待对手…</span>
              </div>
              <p class="turn-sub" id="detail">等待开始</p>
            </div>
          </header>

          <div class="board-slot" id="board-slot">
            <div class="ttt" id="board" role="group" aria-label="井字棋棋盘，三行三列"></div>
          </div>

          <div class="actions">
            <button type="button" class="btn btn--primary" id="share-btn">复制邀请链接</button>
            <button type="button" class="btn btn--primary" id="rematch-btn" hidden>再来一局</button>
            <button type="button" class="btn btn--quiet" id="leave-btn">退出</button>
            <p class="hint" id="hint">双方需同时在线 · 先手按局数轮换</p>
          </div>
        </div>

        <aside class="chat" id="chat" aria-label="房间消息">
          <header class="chat-head">
            <h2 class="chat-title">房间消息</h2>
            <p class="chat-sub">退出即清空</p>
            <button class="chat-toggle" id="chat-toggle" type="button" aria-expanded="false" aria-label="展开或收起消息">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 15l6-6 6 6" />
              </svg>
            </button>
          </header>
          <p class="chat-peek" id="chat-peek">还没有消息</p>
          <div class="chat-list is-empty" id="chat-list" role="log" aria-live="polite" aria-relevant="additions">
            <div class="chat-spacer" aria-hidden="true"></div>
            <div class="chat-empty" id="chat-empty">
              <span class="chat-empty-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20.5 11.7c0 3.9-3.8 7-8.5 7-1 0-2-.15-2.9-.42L4 20l1.35-3.6a6.7 6.7 0 0 1-1.85-4.7c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7Z" />
                </svg>
              </span>
              <p class="chat-empty-title">还没有消息</p>
              <p class="chat-empty-sub">发一句打个招呼</p>
            </div>
          </div>
          <form class="chat-form" id="chat-form" autocomplete="off">
            <input class="chat-input" id="chat-input" type="text" maxlength="80"
                   placeholder="说点什么…" enterkeyhint="send" aria-label="消息内容" />
            <button class="chat-send" id="chat-send" type="submit" aria-label="发送" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4.5 12h13" /><path d="M12 5.8 18.2 12 12 18.2" />
              </svg>
            </button>
          </form>
        </aside>
      </div>
    </section>
  </div>

  <div class="sheet" id="match-dialog" hidden>
    <div class="sheet-scrim" id="md-scrim"></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="md-title">
      <h2 class="sheet-title" id="md-title">本轮对局结束</h2>
      <p class="sheet-text" id="md-text">你 0 · 平 0 · 对方 0</p>
      <div class="sheet-actions">
        <button type="button" class="btn btn--primary btn--wide" id="md-again">再来一轮（清空比分）</button>
        <button type="button" class="btn btn--quiet btn--wide" id="md-close">留在棋盘</button>
      </div>
    </div>
  </div>
  <div class="notice notice--toast" id="notice" hidden></div>

<script async src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"
        onerror="var s=document.createElement('script');s.src='https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js';document.head.appendChild(s);this.remove();"></script>
<script src="./ttt.js"></script>
<script>
  (function () {
    var btn = document.getElementById('theme-btn');
    if (!btn) return;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function current() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function apply(t) {
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('chess-theme', t); } catch (e) {}
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'dark' ? '#000000' : '#f2f2f7');
      btn.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
      document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: t } }));
    }
    btn.addEventListener('click', function () { apply(current() === 'dark' ? 'light' : 'dark'); });
    btn.setAttribute('aria-pressed', current() === 'dark' ? 'true' : 'false');
    if (mq.addEventListener) {
      mq.addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem('chess-theme'); } catch (err) {}
        if (!saved) apply(e.matches ? 'dark' : 'light');
      });
    }
  })();
</script>
</body>
</html>
