<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f2f2f7" />
<title>五子棋 · 联机对战</title>
<script>
  (function () {
    var t = 'light';
    try {
      t = localStorage.getItem('chess-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  })();
</script>
<link rel="stylesheet" href="./theme.css" />
<style>
  #game { display: flex; flex-direction: column; gap: 16px; }
  #lobby .actions-row .btn--ghost { min-width: 84px; }
</style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="icon-btn" href="./" aria-label="返回入口">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 5.5 8 12l6.5 6.5" />
        </svg>
      </a>
      <span class="spacer"></span>
      <span class="pill"><span class="dot" id="dot"></span><span id="conn-text">未连接</span></span>
      <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="切换深色外观">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.1" />
          <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5" />
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.4 14.2A8.5 8.5 0 1 1 9.8 3.6a6.7 6.7 0 0 0 10.6 10.6Z" />
        </svg>
      </button>
    </nav>

    <div class="title-block">
      <h1 class="display">五子棋</h1>
      <p class="subtitle">15 × 15 · 先连成五子者胜</p>
    </div>

    <section class="card" id="lobby">
      <h2>开一局</h2>
      <p>点「创建房间」，把邀请链接发给对方；他打开就自动进同一间房。黑棋先行。</p>
      <div class="notice" id="local-warn" hidden></div>
      <button type="button" class="btn btn--primary btn--wide" id="create-btn">创建房间</button>
      <div class="actions-row">
        <input class="field" id="code-input" type="text" maxlength="5" placeholder="输入房间码"
               autocomplete="off" spellcheck="false" inputmode="latin" aria-label="房间码" />
        <button type="button" class="btn btn--ghost" id="join-btn">加入</button>
      </div>
    </section>

    <div id="game" hidden>
      <dl class="scoreboard" aria-label="比分">
        <div class="score is-me"><dt>你</dt><dd id="score-me">0</dd></div>
        <div class="score"><dt>平局</dt><dd id="score-draw">0</dd></div>
        <div class="score is-opp"><dt>对方</dt><dd id="score-opp">0</dd></div>
      </dl>

      <div class="board-wrap">
        <canvas id="board" class="gmk-canvas" width="600" height="600" tabindex="0" role="application"
                aria-label="五子棋棋盘，15 行 15 列。方向键移动，回车落子。"></canvas>
      </div>

      <div class="status-wrap">
        <div class="status" id="status" role="status" aria-live="polite" data-tone="idle">等待对手…</div>
        <p class="detail" id="detail">房间码 <span class="room-code" id="show-code">-----</span></p>
      </div>

      <div class="actions">
        <div class="actions-row">
          <button type="button" class="btn btn--primary" id="share-btn">复制邀请链接</button>
          <button type="button" class="btn btn--ghost" id="leave-btn">退出</button>
        </div>
        <button type="button" class="btn btn--ghost btn--wide" id="rematch-btn" hidden>再来一局</button>
        <div class="notice" id="notice" hidden></div>
      </div>

      <p class="hint">双方需同时在线 · 先手按局数自动轮换</p>
    </div>
  </div>

<script async src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"
        onerror="var s=document.createElement('script');s.src='https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js';document.head.appendChild(s);this.remove();"></script>
<script src="./gomoku.js"></script>
<script>
  (function () {
    var btn = document.getElementById('theme-btn');
    if (!btn) return;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function current() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function apply(t) {
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('chess-theme', t); } catch (e) {}
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'dark' ? '#000000' : '#f2f2f7');
      btn.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
      document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: t } }));
    }
    btn.addEventListener('click', function () { apply(current() === 'dark' ? 'light' : 'dark'); });
    btn.setAttribute('aria-pressed', current() === 'dark' ? 'true' : 'false');
    if (mq.addEventListener) {
      mq.addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem('chess-theme'); } catch (err) {}
        if (!saved) apply(e.matches ? 'dark' : 'light');
      });
    }
  })();
</script>
</body>
</html>
