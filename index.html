<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f2f2f7" />
<title>棋 · 联机对战</title>
<script>
  (function () {
    var t = 'light';
    try {
      t = localStorage.getItem('chess-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  })();
</script>
<link rel="stylesheet" href="./theme.css" />
<style>
  .wrap { justify-content: center; gap: 20px; }

  .entries { display: grid; gap: 12px; }

  .ico-grid { stroke: var(--label-3); opacity: .55; fill: none; }
  .ico-x { stroke: var(--blue); fill: none; stroke-linecap: round; }
  .ico-o { stroke: var(--orange); fill: none; }
  .ico-black { fill: var(--stone-black); stroke: var(--stone-black-edge); stroke-width: 1.1; }
  .ico-white { fill: var(--stone-white); stroke: var(--stone-white-edge); }
  .ico-xq-piece { fill: none; stroke: var(--xq-red); }
  .ico-xq-glyph {
    fill: var(--xq-red);
    font-size: 11.5px;
    font-family: "Songti SC", "STKaiti", "KaiTi", serif;
    font-weight: 600;
  }

  .foot { display: grid; gap: 5px; margin-top: 2px; }
  .foot p { margin: 0; font-size: 12px; line-height: 1.6; color: var(--label-3); text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <span class="spacer"></span>
      <span class="pill"><span class="dot on"></span>无需注册</span>
      <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="切换深色外观">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.1" />
          <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5" />
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.4 14.2A8.5 8.5 0 1 1 9.8 3.6a6.7 6.7 0 0 0 10.6 10.6Z" />
        </svg>
      </button>
    </nav>

    <div class="title-block">
      <h1 class="display">棋</h1>
      <p class="subtitle">选一个 · 建房 · 把链接发给朋友</p>
    </div>

    <nav class="entries">
      <a class="entry" href="./ttt.html">
        <span class="icon">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <g class="ico-grid" stroke-width="1.4">
              <path d="M16.5 6V42M31.5 6V42M6 16.5H42M6 31.5H42" />
            </g>
            <g class="ico-x" stroke-width="3.2">
              <path d="M4.5 4.5 11.5 11.5" /><path d="M11.5 4.5 4.5 11.5" />
            </g>
            <circle class="ico-o" cx="40" cy="40" r="4.6" stroke-width="3" />
          </svg>
        </span>
        <span class="text">
          <span class="name">井字棋 <span class="badge">联机</span></span>
          <span class="desc">3 × 3 · 连成三子即胜</span>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </a>

      <a class="entry" href="./gomoku.html">
        <span class="icon">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <g class="ico-grid" stroke-width="1.1">
              <path d="M8 8H40M8 16H40M8 24H40M8 32H40M8 40H40" />
              <path d="M8 8V40M16 8V40M24 8V40M32 8V40M40 8V40" />
            </g>
            <circle class="ico-white" cx="8" cy="24" r="3.3" stroke-width="1" />
            <circle class="ico-white" cx="16" cy="24" r="3.3" stroke-width="1" />
            <circle class="ico-white" cx="24" cy="24" r="3.3" stroke-width="1" />
            <circle class="ico-black" cx="32" cy="24" r="3.3" />
            <circle class="ico-black" cx="40" cy="24" r="3.3" />
          </svg>
        </span>
        <span class="text">
          <span class="name">五子棋 <span class="badge">联机</span></span>
          <span class="desc">15 × 15 · 先连五子者胜</span>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </a>

      <a class="entry" href="./maze.html">
        <span class="icon">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <g class="ico-grid" stroke-width="1.4">
              <path d="M10 6V42M24 6V42M38 6V42M6 10H42M6 24H42M6 38H42" />
            </g>
            <circle cx="9" cy="39" r="3.4" fill="var(--blue)" />
            <circle cx="39" cy="9" r="3.4" fill="var(--orange)" />
          </svg>
        </span>
        <span class="text">
          <span class="name">迷宫竞速 <span class="badge">联机</span></span>
          <span class="desc">镜像同一张图 · 先到终点者胜</span>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </a>

      <a class="entry" href="./xiangqi.html">
        <span class="icon">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <g class="ico-grid" stroke-width="1.2">
              <path d="M8 11H40M8 24H40M8 37H40" />
              <path d="M8 11V37M24 11V37M40 11V37" />
            </g>
            <circle class="ico-xq-piece" cx="24" cy="24" r="8.4" stroke-width="1.3" />
            <text class="ico-xq-glyph" x="24" y="24" text-anchor="middle" dominant-baseline="central">帅</text>
          </svg>
        </span>
        <span class="text">
          <span class="name">中国象棋 <span class="badge">联机</span></span>
          <span class="desc">9 × 10 · 将死或困毙即胜</span>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </a>
    </nav>

    <div class="foot">
      <p>房间码即权限，双方需同时在线</p>
      <p>手机与电脑均可，支持明暗外观</p>
    </div>
  </div>

<script>
  // 兼容旧邀请链接：/?r=XXXXX 或 /?m=局面 → 井字棋
  (function () {
    var p = new URLSearchParams(location.search);
    var r = p.get('r');
    var m = p.get('m');
    if (r) location.replace('./ttt.html?r=' + encodeURIComponent(r));
    else if (m) location.replace('./ttt.html?m=' + encodeURIComponent(m));
  })();

  (function () {
    var btn = document.getElementById('theme-btn');
    if (!btn) return;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function current() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function apply(t) {
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('chess-theme', t); } catch (e) {}
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'dark' ? '#000000' : '#f2f2f7');
      btn.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
      document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: t } }));
    }
    btn.addEventListener('click', function () { apply(current() === 'dark' ? 'light' : 'dark'); });
    btn.setAttribute('aria-pressed', current() === 'dark' ? 'true' : 'false');
    if (mq.addEventListener) {
      mq.addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem('chess-theme'); } catch (err) {}
        if (!saved) apply(e.matches ? 'dark' : 'light');
      });
    }
  })();
</script>
</body>
</html>
