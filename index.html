<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>井字棋 · 联机对战</title>
<script
  src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"
  onerror="this.remove();var s=document.createElement('script');s.src='https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js';document.head.appendChild(s);"></script>
<style>
  :root {
    --bg: #0b0f14;
    --surface: #121821;
    --surface-2: #18222f;
    --line: #24303f;
    --text: #e8eef6;
    --muted: #7d8b9e;
    --x: #4fd1c5;
    --o: #f6a35c;
    --accent: #6aa6ff;
    --warn: #f0b429;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    place-items: safe center;
    padding: 26px 18px 36px;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(79, 209, 197, .10), transparent 62%),
      radial-gradient(700px 520px at 110% 112%, rgba(246, 163, 92, .09), transparent 62%),
      var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC",
                 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .shell { width: min(100%, 430px); display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  h1 { margin: 0; font-size: clamp(22px, 6vw, 27px); font-weight: 650; letter-spacing: .02em; }
  h1 span { color: var(--muted); font-weight: 400; font-size: .72em; }

  .conn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted); white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #46566a; transition: background-color .2s ease; }
  .dot.on { background: #3ddc97; box-shadow: 0 0 0 3px rgba(61, 220, 151, .16); }
  .dot.wait { background: var(--warn); }

  /* ---------- 大厅 ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    display: grid;
    gap: 12px;
  }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .card p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--muted); }

  .join { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  input[type="text"] {
    appearance: none;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    letter-spacing: .28em;
    text-transform: uppercase;
    padding: 10px 12px;
    min-width: 0;
  }
  input[type="text"]::placeholder { letter-spacing: .1em; color: #55637a; }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .btn {
    appearance: none; border: 0; font: inherit; font-size: 14px; font-weight: 600;
    padding: 11px 16px; border-radius: 11px; cursor: pointer;
    transition: transform .12s ease, background-color .16s ease, border-color .16s ease, color .16s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--text); color: #0b0f14; }
  .btn-primary:hover { background: #fff; }
  .btn-primary[disabled] { background: #2a3646; color: #6b7a8e; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; font-size: 13px; }
  .btn-ghost:hover { color: var(--text); border-color: #33465c; }

  /* ---------- 比分 ---------- */
  .scoreboard {
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; margin: 0; overflow: hidden;
  }
  .score { padding: 8px 6px 9px; text-align: center; }
  .score + .score { border-left: 1px solid var(--line); }
  .score dt { margin: 0 0 2px; font-size: 11px; letter-spacing: .1em; color: var(--muted); }
  .score dd { margin: 0; font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .score.is-me dd { color: var(--x); }
  .score.is-opp dd { color: var(--o); }

  /* ---------- 棋盘 ---------- */
  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    width: 100%; aspect-ratio: 1 / 1;
    background: var(--line); border: 1px solid var(--line);
    border-radius: 18px; overflow: hidden;
  }
  .cell {
    appearance: none; border: 0; margin: 0; padding: 13%;
    background: var(--surface); color: inherit; font: inherit;
    display: grid; place-items: center; cursor: pointer;
    transition: background-color .16s ease, opacity .25s ease;
  }
  .cell:not(.filled):hover { background: var(--surface-2); }
  .cell.filled { cursor: default; }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 6px; }
  .cell svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .cell svg path, .cell svg circle { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cell.x svg path {
    stroke: var(--x); stroke-width: 9; stroke-dasharray: 68; stroke-dashoffset: 68;
    animation: draw .26s cubic-bezier(.4, .1, .2, 1) forwards;
  }
  .cell.x svg path:nth-child(2) { animation-delay: .12s; }
  .cell.o svg circle {
    stroke: var(--o); stroke-width: 9; stroke-dasharray: 164; stroke-dashoffset: 164;
    transform-origin: 50% 50%; transform: rotate(-90deg);
    animation: draw .4s cubic-bezier(.4, .1, .2, 1) forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .cell.win { animation: pop .5s ease; }
  .cell.x.win { background: rgba(79, 209, 197, .13); }
  .cell.o.win { background: rgba(246, 163, 92, .13); }
  @keyframes pop { 0%,100% { transform: scale(1); } 45% { transform: scale(.94); } }

  .board.is-over .cell:not(.filled) { opacity: .45; }

  /* ---------- 状态 ---------- */
  .status-wrap { display: grid; gap: 4px; text-align: center; min-height: 48px; align-content: center; }
  .status { font-size: 16px; font-weight: 600; transition: color .2s ease; }
  .status[data-tone="win"] { color: var(--x); }
  .status[data-tone="lose"] { color: var(--o); }
  .status[data-tone="wait"] { color: var(--warn); }
  .detail { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--muted); }

  .actions { display: grid; gap: 9px; }
  .actions-row { display: grid; grid-template-columns: 1fr auto; gap: 9px; }

  .notice {
    border: 1px solid rgba(240, 180, 41, .35);
    background: rgba(240, 180, 41, .07);
    color: #e8c877;
    font-size: 12.5px; line-height: 1.6;
    border-radius: 12px; padding: 10px 12px;
    overflow-wrap: anywhere;
  }
  .notice[data-kind="info"] {
    border-color: rgba(79, 209, 197, .32);
    background: rgba(79, 209, 197, .07);
    color: #8fe0d6;
  }
  .notice[hidden] { display: none; }

  #game { display: flex; flex-direction: column; gap: 14px; }

  .hint { margin: 0; text-align: center; font-size: 11.5px; color: #5d6a7c; line-height: 1.6; }
  .room-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .18em; color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .cell.x svg path, .cell.o svg circle, .cell.win { animation: none; }
    .cell.x svg path, .cell.o svg circle { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>井字棋 <span id="mode-label">/ 联机</span></h1>
      <span class="conn"><span class="dot" id="dot"></span><span id="conn-text">未连接</span></span>
    </header>

    <!-- 大厅 -->
    <section class="card" id="lobby">
      <h2>和朋友下一局</h2>
      <p>一个人点「创建房间」，把链接发给对方；对方打开链接就自动进同一间房。</p>
      <div class="notice" id="local-warn" hidden></div>
      <button type="button" class="btn btn-primary" id="create-btn">创建房间</button>
      <div class="join">
        <input type="text" id="code-input" maxlength="5" placeholder="输入房间码" autocomplete="off" spellcheck="false" />
        <button type="button" class="btn btn-ghost" id="join-btn">加入</button>
      </div>
      <p>没有服务器账号，无需注册。房间码就是权限，别公开广播就行。</p>
    </section>

    <!-- 对局 -->
    <div id="game" hidden>
      <dl class="scoreboard" aria-label="比分" id="scoreboard">
        <div class="score is-me"><dt>你</dt><dd id="score-me">0</dd></div>
        <div class="score"><dt>平局</dt><dd id="score-draw">0</dd></div>
        <div class="score is-opp"><dt>对方</dt><dd id="score-opp">0</dd></div>
      </dl>

      <div class="board" id="board" role="group" aria-label="井字棋棋盘，三行三列"></div>

      <div class="status-wrap">
        <div class="status" id="status" role="status" aria-live="polite" data-tone="idle">等待对手…</div>
        <p class="detail" id="detail">房间码 <span class="room-code" id="show-code">-----</span></p>
      </div>

      <div class="actions">
        <div class="actions-row">
          <button type="button" class="btn btn-primary" id="share-btn">复制邀请链接</button>
          <button type="button" class="btn btn-ghost" id="leave-btn">退出</button>
        </div>
        <button type="button" class="btn btn-ghost" id="rematch-btn" hidden>再来一局</button>
        <div class="notice" id="notice" hidden></div>
      </div>
    </div>

    <p class="hint" id="hint">双方需同时在线；谁先手按局数自动轮换，保证公平。</p>
  </main>

<script>
(() => {
  'use strict';

  /* ============================ 常量 ============================ */

  const WIN_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 去掉易混的 I O 0 1
  const BROKERS = [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt'
  ];
  const TOPIC_ROOT = 'goose/ttt/v1/';
  const ME_ID = 'p' + Math.random().toString(36).slice(2, 10);
  const PING_MS = 5000;
  const OFFLINE_MS = 13000;

  /* ============================ DOM ============================ */

  const $ = (id) => document.getElementById(id);
  const lobbyEl = $('lobby');
  const gameEl = $('game');
  const boardEl = $('board');
  const statusEl = $('status');
  const detailEl = $('detail');
  const codeEl = $('show-code');
  const dotEl = $('dot');
  const connTextEl = $('conn-text');
  const noticeEl = $('notice');
  const rematchBtn = $('rematch-btn');
  const shareBtn = $('share-btn');
  const modeLabelEl = $('mode-label');
  const hintEl = $('hint');
  const scoreEls = { me: $('score-me'), draw: $('score-draw'), opp: $('score-opp') };

  /* ============================ 状态 ============================ */

  const S = {
    mode: 'lobby',        // 'lobby' | 'online' | 'relay'
    code: '',
    role: '',             // 'host' | 'guest'
    round: 0,
    myMark: 'X',
    oppMark: 'O',
    board: Array(9).fill(null),
    turn: 'X',
    over: false,
    overReason: '',
    score: { me: 0, draw: 0, opp: 0 },
    oppOnline: false,
    lastSeen: 0,
    sentRematch: false,
    gotRematch: false,
    cells: [],
    client: null,
    pingTimer: null,
    brokerIndex: 0,
    brokerTries: 0,
    connected: false
  };

  /* ============================ 工具 ============================ */

  const other = (m) => (m === 'X' ? 'O' : 'X');

  function makeCode() {
    let s = '';
    for (let i = 0; i < 5; i++) s += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
    return s;
  }

  function markSVG(mark) {
    return mark === 'X'
      ? '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">' +
          '<path d="M26 26 L74 74"/><path d="M74 26 L26 74"/></svg>'
      : '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">' +
          '<circle cx="50" cy="50" r="26"/></svg>';
  }

  function cellLabel(i, mark) {
    return '第 ' + (Math.floor(i / 3) + 1) + ' 行第 ' + (i % 3 + 1) + ' 列，' + (mark || '空');
  }

  function setStatus(text, tone) {
    statusEl.textContent = text;
    statusEl.dataset.tone = tone || 'idle';
  }

  function setDetail(html) { detailEl.innerHTML = html; }

  function setNotice(text, kind) {
    if (text) {
      noticeEl.textContent = text;
      noticeEl.dataset.kind = kind || 'warn';
      noticeEl.hidden = false;
    } else {
      noticeEl.hidden = true;
      noticeEl.textContent = '';
    }
  }

  function setConn(state, text) {
    dotEl.className = 'dot' + (state === 'on' ? ' on' : state === 'wait' ? ' wait' : '');
    connTextEl.textContent = text;
  }

  function renderScore() {
    scoreEls.me.textContent = S.score.me;
    scoreEls.draw.textContent = S.score.draw;
    scoreEls.opp.textContent = S.score.opp;
  }

  /* ============================ 规则 ============================ */

  function getResult(board) {
    for (let i = 0; i < WIN_LINES.length; i++) {
      const l = WIN_LINES[i];
      const a = board[l[0]];
      if (a && a === board[l[1]] && a === board[l[2]]) {
        return { winner: a, line: l, reason: 'win' };
      }
    }
    let full = true;
    for (let i = 0; i < board.length; i++) if (!board[i]) { full = false; break; }
    if (full) return { winner: null, line: null, reason: 'full' };
    if (isDead(board)) return { winner: null, line: null, reason: 'dead' };
    return null;
  }

  function isDead(board) {
    for (let i = 0; i < WIN_LINES.length; i++) {
      const l = WIN_LINES[i];
      let hasX = false;
      let hasO = false;
      for (let k = 0; k < 3; k++) {
        const v = board[l[k]];
        if (v === 'X') hasX = true;
        else if (v === 'O') hasO = true;
      }
      if (!(hasX && hasO)) return false;
    }
    return true;
  }

  function turnFromBoard(board) {
    let x = 0;
    let o = 0;
    for (let i = 0; i < board.length; i++) {
      if (board[i] === 'X') x++;
      else if (board[i] === 'O') o++;
    }
    return x > o ? 'O' : 'X';
  }

  /* ============================ 棋盘渲染 ============================ */

  function buildBoard() {
    boardEl.textContent = '';
    S.cells = [];
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell';
      btn.dataset.index = String(i);
      btn.setAttribute('aria-label', cellLabel(i, null));
      btn.addEventListener('click', () => onCellClick(i));
      btn.addEventListener('keydown', onCellKeydown);
      boardEl.appendChild(btn);
      S.cells.push(btn);
    }
  }

  function onCellKeydown(event) {
    const keys = ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'];
    if (keys.indexOf(event.key) === -1) return;
    event.preventDefault();
    const i = Number(event.currentTarget.dataset.index);
    let row = Math.floor(i / 3);
    let col = i % 3;
    if (event.key === 'ArrowRight') col = (col + 1) % 3;
    if (event.key === 'ArrowLeft') col = (col + 2) % 3;
    if (event.key === 'ArrowDown') row = (row + 1) % 3;
    if (event.key === 'ArrowUp') row = (row + 2) % 3;
    S.cells[row * 3 + col].focus();
  }

  function paintCell(i, mark) {
    const cell = S.cells[i];
    cell.classList.add('filled', mark === 'X' ? 'x' : 'o');
    cell.innerHTML = markSVG(mark);
    cell.setAttribute('aria-disabled', 'true');
    cell.setAttribute('aria-label', cellLabel(i, mark));
  }

  function clearBoard() {
    boardEl.classList.remove('is-over');
    S.cells.forEach((cell, i) => {
      cell.className = 'cell';
      cell.style.animationDelay = '';
      cell.innerHTML = '';
      cell.removeAttribute('aria-disabled');
      cell.setAttribute('aria-label', cellLabel(i, null));
    });
  }

  function renderFullBoard(board) {
    clearBoard();
    for (let i = 0; i < 9; i++) if (board[i]) paintCell(i, board[i]);
    S.board = board.slice();
    S.turn = turnFromBoard(S.board);
  }

  /* ============================ 走子 ============================ */

  // 返回 true 表示本步结束了对局
  function placeMark(index, mark) {
    S.board[index] = mark;
    paintCell(index, mark);

    const result = getResult(S.board);
    if (result) { finishRound(result); return true; }
    S.turn = other(mark);
    return false;
  }

  function onCellClick(index) {
    if (S.mode === 'relay') { relayMove(index); return; }
    if (S.mode !== 'online') return;
    if (!S.oppOnline) { setStatus('等待对手加入…', 'wait'); return; }
    if (S.over) return;
    if (S.turn !== S.myMark) return;
    if (S.board[index]) return;

    const ended = placeMark(index, S.myMark);
    publish({ t: 'move', i: index, round: S.round });
    if (ended) return;

    setStatus('轮到对方了', 'idle');
    setDetail('你执 ' + S.myMark + '，等对方落子。');
  }

  function finishRound(result) {
    S.over = true;
    S.overReason = result.reason;
    boardEl.classList.add('is-over');

    if (result.winner === S.myMark) {
      S.score.me++;
      setStatus('你赢了', 'win');
      setDetail('三连成功。');
    } else if (result.winner === S.oppMark) {
      S.score.opp++;
      setStatus('对方赢了', 'lose');
      setDetail('这局被对方拿下。');
    } else if (result.reason === 'dead') {
      S.score.draw++;
      setStatus('死局', 'wait');
      setDetail('已无任何可能的三连线，判定平局。');
    } else {
      S.score.draw++;
      setStatus('平局', 'wait');
      setDetail('棋盘已满，平局。');
    }

    if (result.line) {
      result.line.forEach((idx, order) => {
        const cell = S.cells[idx];
        cell.classList.add('win');
        cell.style.animationDelay = (order * 70) + 'ms';
      });
    }

    renderScore();

    if (S.mode === 'online') {
      S.sentRematch = false;
      S.gotRematch = false;
      rematchBtn.hidden = false;
      rematchBtn.textContent = '再来一局';
    } else {
      updateRelayUi();
    }
  }

  function resetRound() {
    S.board = Array(9).fill(null);
    S.turn = 'X';
    S.over = false;
    S.overReason = '';
    S.sentRematch = false;
    S.gotRematch = false;
    rematchBtn.hidden = true;
    clearBoard();
    assignMarks();

    if (S.mode === 'online') {
      if (S.myMark === 'X') {
        setStatus('轮到你了', 'idle');
        setDetail('你执 X，请落子。');
      } else {
        setStatus('等对方落子', 'idle');
        setDetail('你执 O，对方先手。');
      }
    } else {
      updateRelayUi();
    }
  }

  // 局数决定先手：偶数局房主执 X，奇数局交换
  function assignMarks() {
    if (S.mode === 'relay') {
      S.myMark = S.turn;
      S.oppMark = other(S.turn);
      return;
    }
    const hostMark = S.round % 2 === 0 ? 'X' : 'O';
    S.myMark = S.role === 'host' ? hostMark : other(hostMark);
    S.oppMark = other(S.myMark);
  }

  /* ============================ 联机：MQTT ============================ */

  function publish(msg) {
    if (!S.client || !S.connected) return;
    msg.f = ME_ID;
    msg.r = S.code;
    try {
      S.client.publish(TOPIC_ROOT + S.code, JSON.stringify(msg), { qos: 0 });
    } catch (err) { /* 忽略瞬时失败 */ }
  }

  function connectBroker() {
    if (typeof mqtt === 'undefined') {
      setConn('', '连接库加载失败');
      setNotice('无法加载联机库（可能网络或公司代理拦截）。可以改用「链接接力」模式：下完一手把链接发对方。');
      return;
    }

    const url = BROKERS[S.brokerIndex];
    S.brokerTries++;
    setConn('wait', '连接中…');

    let settled = false;
    const client = mqtt.connect(url, {
      clientId: 'ttt_' + ME_ID + '_' + S.code,
      clean: true,
      keepalive: 30,
      reconnectPeriod: 3000,
      connectTimeout: 8000
    });
    S.client = client;

    const fallback = setTimeout(() => {
      if (settled) return;
      try { client.end(true); } catch (err) {}
      nextBroker();
    }, 8000);

    client.on('connect', () => {
      settled = true;
      clearTimeout(fallback);
      S.connected = true;
      setConn('wait', '等待对手…');
      client.subscribe(TOPIC_ROOT + S.code, { qos: 0 });
      publish({ t: 'hello', role: S.role, round: S.round });
      startPing();
      setNotice('');
    });

    client.on('message', (topic, payload) => {
      let msg;
      try { msg = JSON.parse(payload.toString()); } catch (err) { return; }
      handleMessage(msg);
    });

    client.on('error', () => { /* mqtt.js 会自动重连 */ });

    client.on('close', () => {
      if (S.connected) {
        S.connected = false;
        setConn('wait', '重连中…');
      }
    });

    client.on('reconnect', () => setConn('wait', '重连中…'));
  }

  function nextBroker() {
    S.brokerIndex = (S.brokerIndex + 1) % BROKERS.length;
    if (S.brokerTries >= BROKERS.length) {
      setConn('', '连不上服务器');
      setNotice('两个公共服务器都连不上，可能是网络限制。可改用「链接接力」：每走一手把当前链接发给对方。');
      enableRelayFallback();
      return;
    }
    connectBroker();
  }

  function startPing() {
    stopPing();
    S.pingTimer = setInterval(() => {
      publish({ t: 'ping' });
      if (S.oppOnline && Date.now() - S.lastSeen > OFFLINE_MS) {
        S.oppOnline = false;
        setConn('wait', '对方离线');
        if (!S.over && S.mode === 'online') setStatus('对方离线了', 'wait');
      }
    }, PING_MS);
  }

  function stopPing() {
    if (S.pingTimer) { clearInterval(S.pingTimer); S.pingTimer = null; }
  }

  function handleMessage(msg) {
    if (!msg || msg.f === ME_ID) return;
    if (msg.r && msg.r !== S.code) return;

    S.lastSeen = Date.now();
    if (!S.oppOnline && msg.t !== 'bye') {
      S.oppOnline = true;
      setConn('on', '对方在线');
      if (!S.over) {
        if (S.mode === 'relay') return;
        if (S.turn === S.myMark) { setStatus('轮到你了', 'idle'); setDetail('你执 ' + S.myMark + '，请落子。'); }
        else { setStatus('等对方落子', 'idle'); setDetail('你执 ' + S.myMark + '。'); }
      }
    }

    switch (msg.t) {
      case 'hello':
        publish({ t: 'here', role: S.role, round: S.round });
        if (S.board.some(Boolean)) publish({ t: 'state', round: S.round, board: S.board });
        break;

      case 'here':
        break;

      case 'state':
        if (msg.round >= S.round && !S.board.some(Boolean) && Array.isArray(msg.board)) {
          S.round = msg.round;
          assignMarks();
          renderFullBoard(msg.board);
          const r = getResult(S.board);
          if (r) finishRound(r);
          else if (S.turn === S.myMark) { setStatus('轮到你了', 'idle'); setDetail('你执 ' + S.myMark + '，棋局已同步。'); }
          else { setStatus('等对方落子', 'idle'); setDetail('你执 ' + S.myMark + '，棋局已同步。'); }
        }
        break;

      case 'move':
        if (msg.round !== S.round || S.over) return;
        if (S.turn !== S.oppMark) return;          // 不该对方走
        if (S.board[msg.i] || typeof msg.i !== 'number') return;
        {
          const ended = placeMark(msg.i, S.oppMark);
          if (ended) return;
          setStatus('轮到你了', 'idle');
          setDetail('你执 ' + S.myMark + '，请落子。');
        }
        break;

      case 'rematch':
        if (msg.round !== S.round) return;
        S.gotRematch = true;
        if (S.sentRematch) { nextRound(); }
        else {
          rematchBtn.hidden = false;
          rematchBtn.textContent = '对方想再来一局 · 同意';
          setDetail('对方请求再来一局。');
        }
        break;

      case 'bye':
        S.oppOnline = false;
        setConn('wait', '对方已离开');
        break;

      default:
        break;
    }
  }

  function requestRematch() {
    if (!S.over || S.mode !== 'online') return;
    S.sentRematch = true;
    publish({ t: 'rematch', round: S.round });
    rematchBtn.textContent = '等待对方同意…';
    setDetail('已发送「再来一局」请求。');
    if (S.gotRematch) nextRound();
  }

  function nextRound() {
    S.round++;
    resetRound();
  }

  /* ============================ 链接接力模式 ============================ */

  function encodeBoard(board) {
    let s = '';
    for (let i = 0; i < 9; i++) s += board[i] || '-';
    return s;
  }

  function decodeBoard(str) {
    if (typeof str !== 'string' || str.length !== 9) return null;
    const out = Array(9).fill(null);
    for (let i = 0; i < 9; i++) {
      const c = str[i];
      if (c === '-') continue;
      if (c !== 'X' && c !== 'O') return null;
      out[i] = c;
    }
    return out;
  }

  function startRelay(board) {
    S.mode = 'relay';
    modeLabelEl.textContent = '/ 接力';
    lobbyEl.hidden = true;
    gameEl.hidden = false;
    document.getElementById('scoreboard').hidden = true;
    rematchBtn.hidden = true;
    shareBtn.textContent = '复制链接给对方';
    hintEl.textContent = '接力模式：你走一手 → 复制链接发给对方 → 他打开走一手 → 再发回来。';

    renderFullBoard(board);
    const r = getResult(S.board);
    if (r) finishRound(r);
    else {
      S.myMark = S.turn;
      S.oppMark = other(S.turn);
      setStatus('轮到你（' + S.myMark + '）', 'idle');
      updateRelayUi();
    }
    setConn('', '接力模式');
  }

  function relayMove(index) {
    if (S.over) return;
    if (S.board[index]) return;
    const ended = placeMark(index, S.myMark);
    if (!ended) {
      S.myMark = S.turn;
      S.oppMark = other(S.turn);
    }
    updateRelayUi();
    if (ended) return;
  }

  function updateRelayUi() {
    const code = encodeBoard(S.board);
    const isFile = location.protocol === 'file:';
    const link = isFile ? '' : location.origin + location.pathname + '?m=' + code;
    try { history.replaceState(null, '', '?m=' + code); } catch (err) {}

    if (S.over) {
      setDetail('本局结束。点「新的一局」重新开始。');
      shareBtn.textContent = '新的一局';
      shareBtn.dataset.action = 'restart';
    } else {
      setDetail('当前局面 <span class="room-code">' + code + '</span> · 你执 ' + S.myMark +
        (isFile ? '（本地打开时请把文件和局面码一起发给对方）' : '，走完把链接发给对方。'));
      shareBtn.textContent = isFile ? '复制局面码' : '复制链接给对方';
      shareBtn.dataset.action = 'share';
    }
    shareBtn.dataset.link = link || code;
  }

  /* ============================ 房间 / 分享 ============================ */

  function roomUrl(code) {
    if (!isPublicUrl()) return '';
    return location.origin + location.pathname + '?r=' + code;
  }

  // 只有真正的公网地址才能发给别人；localhost / file:// 只能自己看
  function isPublicUrl() {
    if (location.protocol === 'file:') return false;
    const h = location.hostname || '';
    return !(h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h === '[::1]' || h === '::1');
  }

  function copyText(text) {
    if (!text) return Promise.reject(new Error('empty'));
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('copy failed'));
      } catch (err) { reject(err); }
    });
  }

  function showLink(text, fallbackLabel) {
    setNotice('');
    copyText(text).then(
      () => setNotice('已复制：' + text, 'info'),
      () => setNotice(fallbackLabel + '：' + text, 'info')
    );
  }

  function enterGame() {
    lobbyEl.hidden = true;
    gameEl.hidden = false;
    codeEl.textContent = S.code;
  }

  function startOnline(code, role) {
    S.mode = 'online';
    S.code = code;
    S.role = role;
    S.round = 0;
    assignMarks();
    enterGame();
    resetRound();
    setStatus('连接中…', 'wait');
    connectBroker();
  }

  function createRoom() {
    startOnline(makeCode(), 'host');
    if (location.protocol !== 'file:') {
      try { history.replaceState(null, '', '?r=' + S.code); } catch (err) {}
    }
  }

  function joinRoom(raw) {
    const code = String(raw || '').trim().toUpperCase();
    if (code.length !== 5) { setNotice('房间码是 5 位字母/数字。'); return; }
    startOnline(code, 'guest');
    if (location.protocol !== 'file:') {
      try { history.replaceState(null, '', '?r=' + code); } catch (err) {}
    }
  }

  function enableRelayFallback() {
    shareBtn.textContent = '改用接力模式';
    shareBtn.dataset.action = 'relay';
    shareBtn.dataset.link = '';
  }

  function leaveRoom() {
    publish({ t: 'bye' });
    stopPing();
    if (S.client) { try { S.client.end(true); } catch (err) {} }
    S.client = null;
    S.connected = false;
    S.oppOnline = false;
    S.mode = 'lobby';
    S.code = '';
    gameEl.hidden = true;
    lobbyEl.hidden = false;
    modeLabelEl.textContent = '/ 联机';
    setConn('', '未连接');
    setStatus('等待对手…', 'idle');
    try { history.replaceState(null, '', location.pathname); } catch (err) {}
  }

  /* ============================ 事件绑定 ============================ */

  function bind() {
    $('create-btn').addEventListener('click', createRoom);
    $('join-btn').addEventListener('click', () => joinRoom($('code-input').value));
    $('code-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinRoom($('code-input').value);
    });
    $('leave-btn').addEventListener('click', leaveRoom);
    rematchBtn.addEventListener('click', requestRematch);

    shareBtn.addEventListener('click', () => {
      const action = shareBtn.dataset.action || 'share';
      if (action === 'relay') {
        startRelay(S.board);
        return;
      }
      if (action === 'restart') {
        S.round++;
        resetRound();
        shareBtn.dataset.action = 'share';
        S.mode = 'relay';
        updateRelayUi();
        return;
      }
      if (S.mode === 'relay') { showLink(shareBtn.dataset.link, '手动复制这个链接'); return; }

      const url = roomUrl(S.code);
      if (url) {
        showLink(url, '把这个链接发给对方');
      } else {
        copyText(S.code).then(
          () => setNotice('已复制房间码 ' + S.code + '。但你现在用的是本机地址（localhost / 文件），对方打不开这个页面 —— 请先用公网地址（部署到 Pages 或隧道）打开本页，再创建房间。', 'warn'),
          () => setNotice('房间码是 ' + S.code + '，但本机地址对方打不开。请先部署到公网再用。', 'warn')
        );
      }
    });
  }

  /* ============================ 启动 ============================ */

  function boot() {
    buildBoard();
    bind();

    const params = new URLSearchParams(location.search);
    const relay = params.get('m');
    const room = (params.get('r') || '').toUpperCase();

    if (relay) {
      const board = decodeBoard(relay);
      if (board) { startRelay(board); return; }
    }
    if (room && room.length === 5) {
      joinRoom(room);
      return;
    }
    lobbyEl.hidden = false;
    gameEl.hidden = true;

    if (!isPublicUrl()) {
      const warn = $('local-warn');
      warn.hidden = false;
      warn.dataset.kind = 'warn';
      warn.textContent = location.protocol === 'file:'
        ? '你现在是双击本地文件打开的 —— 只能自己玩，链接发出去对方打不开。要联机，请用公网地址打开本页。'
        : '你现在用的是本机地址 localhost —— 复制的链接对方打不开。要联机，请用公网地址（部署到 Pages 或开隧道）打开本页。';
    }
  }

  // 供无头测试使用（浏览器里无副作用）
  window.__ttt = { S, startOnline, joinRoom, createRoom, handleMessage, getResult, encodeBoard, decodeBoard, assignMarks, onCellClick, requestRematch, placeMark };

  boot();
})();
</script>
</body>
</html>
