<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>棋 · 联机对战</title>
<style>
  :root {
    --bg: #0b0f14;
    --surface: #121821;
    --surface-2: #18222f;
    --line: #24303f;
    --text: #e8eef6;
    --muted: #7d8b9e;
    --teal: #4fd1c5;
    --amber: #f6a35c;
    --blue: #6aa6ff;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    place-items: safe center;
    padding: 32px 18px 40px;
    background:
      radial-gradient(900px 620px at 50% -12%, rgba(106, 166, 255, .12), transparent 62%),
      radial-gradient(720px 520px at 108% 112%, rgba(246, 163, 92, .08), transparent 62%),
      var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC",
                 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .shell { width: min(100%, 470px); display: flex; flex-direction: column; gap: 22px; }

  header { display: grid; gap: 6px; }
  h1 {
    margin: 0;
    font-size: clamp(30px, 9vw, 40px);
    font-weight: 650;
    letter-spacing: .08em;
  }
  .sub { margin: 0; font-size: 13px; color: var(--muted); letter-spacing: .04em; }

  .games { display: grid; gap: 12px; }

  .game {
    position: relative;
    display: grid;
    grid-template-columns: 64px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: border-color .18s ease, background-color .18s ease, transform .18s ease;
  }
  .game::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(240px 140px at 12% 50%, var(--glow, rgba(106,166,255,.16)), transparent 70%);
    opacity: 0;
    transition: opacity .22s ease;
    pointer-events: none;
  }
  .game:hover { border-color: #33465c; background: var(--surface-2); }
  .game:hover::after { opacity: 1; }
  .game:active { transform: translateY(1px); }
  .game:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

  .icon {
    width: 64px; height: 64px;
    border-radius: 14px;
    background: #0d141c;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
  }
  .icon svg { width: 44px; height: 44px; display: block; }

  .text { display: grid; gap: 3px; min-width: 0; }
  .name { font-size: 17px; font-weight: 650; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 10px; font-weight: 500; letter-spacing: .08em;
    color: #8fd6ff; border: 1px solid rgba(106,166,255,.35);
    background: rgba(106,166,255,.08);
    padding: 1px 6px; border-radius: 20px;
  }
  .desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  .arrow {
    font-size: 18px; color: #46566a;
    transition: color .18s ease, transform .18s ease;
  }
  .game:hover .arrow { color: var(--text); transform: translateX(3px); }

  .foot {
    display: grid; gap: 6px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .foot p { margin: 0; font-size: 12px; color: #5d6a7c; line-height: 1.7; }
  .dot { color: var(--teal); }

  @media (prefers-reduced-motion: reduce) {
    .game, .game::after, .arrow { transition: none; }
  }
</style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>棋</h1>
      <p class="sub">选一个，建房，把链接发给朋友</p>
    </header>

    <nav class="games">
      <a class="game" href="./ttt.html" style="--glow: rgba(79,209,197,.16)">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <g stroke="#2c3d4f" stroke-width="1.6">
              <path d="M17 6V42M31 6V42M6 17H42M6 31H42" />
            </g>
            <g stroke="#4fd1c5" stroke-width="3" stroke-linecap="round">
              <path d="M9 9 L15 15" /><path d="M15 9 L9 15" />
            </g>
            <circle cx="37" cy="37" r="4" stroke="#f6a35c" stroke-width="2.6" />
          </svg>
        </span>
        <span class="text">
          <span class="name">井字棋 <span class="badge">联机</span></span>
          <span class="desc">3 × 3，连成三子即胜<br />最快十秒一局</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="game" href="./gomoku.html" style="--glow: rgba(246,163,92,.14)">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <g stroke="#2c3d4f" stroke-width="1.2">
              <path d="M8 8H40M8 16H40M8 24H40M8 32H40M8 40H40" />
              <path d="M8 8V40M16 8V40M24 8V40M32 8V40M40 8V40" />
            </g>
            <g fill="#e8eef6">
              <circle cx="8" cy="24" r="3.2" />
              <circle cx="16" cy="24" r="3.2" />
              <circle cx="24" cy="24" r="3.2" />
            </g>
            <g fill="#141c26" stroke="rgba(120,145,170,.6)" stroke-width="1">
              <circle cx="32" cy="24" r="3.2" />
              <circle cx="40" cy="24" r="3.2" />
            </g>
          </svg>
        </span>
        <span class="text">
          <span class="name">五子棋 <span class="badge">联机</span></span>
          <span class="desc">15 × 15，先连成五子者胜<br />黑棋先行，先手自动轮换</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <div class="foot">
      <p><span class="dot">●</span> 无需注册，房间码即权限。建房后点「复制邀请链接」，对方打开即进房。</p>
      <p>双方需同时在线 · 支持手机与电脑</p>
    </div>
  </main>

<script>
  // 兼容旧链接：/ ?r=XXXXX 或 ?m=局面 直接跳到井字棋
  (function () {
    var p = new URLSearchParams(location.search);
    var r = p.get('r');
    var m = p.get('m');
    if (r) location.replace('./ttt.html?r=' + encodeURIComponent(r));
    else if (m) location.replace('./ttt.html?m=' + encodeURIComponent(m));
  })();
</script>
</body>
</html>
